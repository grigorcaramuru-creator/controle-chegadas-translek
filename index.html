<style>
.schedulePage{max-width:1600px;margin:auto;padding:16px}
.scheduleGrid{display:grid;grid-template-columns:370px 1fr;gap:14px}
.scheduleForm{padding:16px}
.scheduleStats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.scheduleStat{padding:15px}.scheduleStat b{display:block;font-size:25px;color:#0b3b8e}.scheduleStat span{display:block;margin-top:5px;font-size:9px;color:var(--muted)}
.scheduleToolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:#fbfcfe}
.scheduleToolbar>div{min-width:180px}.scheduleToolbar label{margin:0 0 5px}
.scheduleStatus{display:inline-block;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900}
.scheduleProgrammed{background:#eaf3ff;color:#0b4fb7}.scheduleWatching{background:#fff2d8;color:#a05b00}.scheduleStarted{background:#e8f8ef;color:#087a3d}.scheduleLate{background:#ffe8ea;color:#c91828}
.scheduleBtn{border:0;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:800;cursor:pointer;color:#fff;background:#0d63e5}
.scheduleEdit{background:#6a35c5}.scheduleStart{background:#18a75b}.scheduleDelete{background:#e01c2b}
.departureAlertArea{display:none;margin-bottom:14px}.departureAlertArea.show{display:block}
.departureAlertTitle{font-weight:900;color:#c91828;font-size:13px;margin-bottom:8px}.departureAlertList{display:grid;gap:8px}
.departureAlert{width:100%;border:0;color:#fff;background:#d71920;border-radius:12px;padding:14px;text-align:left;cursor:pointer;animation:departurePulse 1s infinite}
.departureAlert.late{background:#8e0010}.departureAlert b{font-size:16px}.departureAlert span{display:block;font-size:11px;margin-top:5px}
@keyframes departurePulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(215,25,32,.7)}50%{transform:scale(1.01);box-shadow:0 0 0 8px rgba(215,25,32,0)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(215,25,32,0)}}
@media(max-width:900px){.scheduleGrid{grid-template-columns:1fr}.scheduleStats{grid-template-columns:1fr 1fr}}
</style>

<script>
let programmingCache=[];

(function(){
  const nav=document.querySelector('.tabs');
  const btn=document.createElement('button');
  btn.className='tabBtn'; btn.dataset.view='programmingView'; btn.innerHTML='🗓 Programação de Viagens';
  nav.appendChild(btn);

  const view=document.createElement('div');
  view.id='programmingView'; view.className='view';
  view.innerHTML=`
  <div class="schedulePage">
    <div class="scheduleStats">
      <div class="card scheduleStat"><b id="programToday">0</b><span>SAÍDAS PROGRAMADAS HOJE</span></div>
      <div class="card scheduleStat"><b id="programNext30" style="color:#e01c2b">0</b><span>SAÍDAS NOS PRÓXIMOS 30 MIN</span></div>
      <div class="card scheduleStat"><b id="programStarted" style="color:#18a75b">0</b><span>INICIADAS</span></div>
      <div class="card scheduleStat"><b id="programPending" style="color:#f26b00">0</b><span>PENDENTES</span></div>
    </div>
    <div class="scheduleGrid">
      <div class="card scheduleForm">
        <div class="sectionTitle"><span>▣</span><h2>Nova programação</h2></div>
        <label>Data da saída</label><input id="programDate" type="date">
        <label>Horário da saída</label><input id="programTime" type="time">
        <label>Trecho</label><select id="programRoute"></select>
        <label>Empresa</label><input id="programCompany" placeholder="Empresa / agregado">
        <label>Motorista</label><input id="programDriver" placeholder="Nome do motorista">
        <div class="row2"><div><label>Placa</label><input id="programPlate" placeholder="ABC-1D23"></div><div><label>ID / Viagem</label><input id="programTripId" placeholder="ID"></div></div>
        <label>Observação</label><textarea id="programObservation" placeholder="Informações adicionais..."></textarea>
        <button class="primary" onclick="saveProgramming()">＋ Salvar programação</button>
        <div class="small" style="margin-top:8px">A programação não altera a forma atual de lançar viagens na Operação.</div>
      </div>
      <div class="card sectionCard">
        <div class="sectionHead"><div><h2>🗓 Programação diária</h2><p>Controle das saídas planejadas.</p></div><span id="programmingBadge" class="tag">0 PROGRAMADAS</span></div>
        <div class="scheduleToolbar">
          <div><label>Data</label><input id="programFilterDate" type="date"></div>
          <div><label>Buscar motorista</label><input id="programFilterDriver" placeholder="Nome do motorista"></div>
          <div><label>Empresa</label><input id="programFilterCompany" placeholder="Empresa"></div>
          <button class="secondaryBtn" onclick="clearProgrammingFilters()">Limpar filtros</button>
        </div>
        <div class="tableScroll"><table><thead><tr><th>DATA</th><th>HORÁRIO</th><th>TRECHO</th><th>MOTORISTA</th><th>EMPRESA</th><th>PLACA</th><th>ID</th><th>STATUS</th><th>AÇÕES</th></tr></thead><tbody id="programmingBody"></tbody></table></div>
      </div>
    </div>
  </div>`;
  document.body.insertBefore(view,document.getElementById('justifyModal'));

  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tabBtn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active'); view.classList.add('active'); renderProgramming();
  });

  const right=document.querySelector('#operationView .right');
  if(right){
    const box=document.createElement('div');
    box.id='departureAlertArea'; box.className='card pad departureAlertArea';
    box.innerHTML='<div class="departureAlertTitle">🚨 ATENÇÃO • PRÓXIMAS SAÍDAS</div><div id="departureAlertList" class="departureAlertList"></div>';
    right.prepend(box);
  }
})();

function progToday(){return dayKey(new Date())}
function progDT(p){return new Date(`${p.program_date}T${String(p.departure_time||'00:00').slice(0,5)}:00`)}
function progMins(p){return Math.floor((progDT(p)-new Date())/60000)}
function progTimeText(m){return m<0?`ATRASADA HÁ ${Math.abs(m)} MIN`:m===0?'SAÍDA AGORA':`SAÍDA EM ${m} MIN`}
function progStatus(p){
  if(p.status==='INICIADA')return{text:'INICIADA',cls:'scheduleStarted'};
  const m=progMins(p);
  if(m<0)return{text:'ATRASADA',cls:'scheduleLate'};
  if(m<=30)return{text:'ACOMPANHAR',cls:'scheduleWatching'};
  return{text:'PROGRAMADA',cls:'scheduleProgrammed'};
}

$('programRoute').innerHTML='<option value="">Selecione o trecho</option>'+Object.keys(TIMES).sort().map(r=>`<option value="${r}">${r}</option>`).join('');
$('programDate').value=progToday(); $('programFilterDate').value=progToday();

async function saveProgramming(){
  const date=$('programDate').value,time=$('programTime').value,r=$('programRoute').value;
  if(!date||!time||!r)return alert('Preencha data, horário e trecho.');
  await api('trip_programming',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({
    program_date:date,departure_time:time,route:r.replace('-',' → '),
    company:$('programCompany').value.trim(),driver:$('programDriver').value.trim(),
    plate:$('programPlate').value.trim().toUpperCase(),trip_id:$('programTripId').value.trim(),
    observation:$('programObservation').value.trim(),status:'PROGRAMADA'
  })});
  $('programTime').value=''; $('programCompany').value=''; $('programDriver').value=''; $('programPlate').value=''; $('programTripId').value=''; $('programObservation').value='';
  await loadProgramming();
}
async function deleteProgramming(id){if(!confirm('Excluir esta programação?'))return;await api('trip_programming?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}});loadProgramming()}
async function startProgramming(id){await api('trip_programming?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'INICIADA',updated_at:new Date().toISOString()})});loadProgramming()}
async function editProgramming(id){
  const p=programmingCache.find(x=>String(x.id)===String(id)); if(!p)return;
  const time=prompt('Horário da saída (HH:MM):',String(p.departure_time||'').slice(0,5)); if(!time)return;
  const driver=prompt('Motorista:',p.driver||''); if(driver===null)return;
  const company=prompt('Empresa:',p.company||''); if(company===null)return;
  const plate=prompt('Placa:',p.plate||''); if(plate===null)return;
  await api('trip_programming?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({departure_time:time,driver:driver.trim(),company:company.trim(),plate:plate.trim().toUpperCase(),updated_at:new Date().toISOString()})});
  loadProgramming();
}
function clearProgrammingFilters(){$('programFilterDate').value=progToday();$('programFilterDriver').value='';$('programFilterCompany').value='';renderProgramming()}
function openProgrammingFromAlert(id){
  const b=[...document.querySelectorAll('.tabBtn')].find(x=>x.dataset.view==='programmingView'); if(b)b.click();
  const p=programmingCache.find(x=>String(x.id)===String(id)); if(p){$('programFilterDate').value=p.program_date;renderProgramming()}
}
function renderDepartureAlerts(){
  const area=$('departureAlertArea'),list=$('departureAlertList'); if(!area||!list)return;
  const alerts=programmingCache.filter(p=>p.program_date===progToday()&&p.status!=='INICIADA'&&progMins(p)<=30).sort((a,b)=>progDT(a)-progDT(b));
  if(!alerts.length){area.classList.remove('show');list.innerHTML='';return}
  area.classList.add('show');
  list.innerHTML=alerts.map(p=>{const m=progMins(p);return `<button class="departureAlert ${m<0?'late':''}" onclick="openProgrammingFromAlert(${p.id})"><b>🔴 ${progTimeText(m)}</b><span>${esc(p.route||'—')} • ${String(p.departure_time||'').slice(0,5)}${p.driver?' • '+esc(p.driver):''}${p.company?' • '+esc(p.company):''}</span></button>`}).join('');
}
function renderProgramming(){
  if(!$('programmingBody'))return;
  const date=$('programFilterDate').value,df=$('programFilterDriver').value.trim().toLowerCase(),cf=$('programFilterCompany').value.trim().toLowerCase();
  let items=[...programmingCache].filter(x=>(!date||x.program_date===date)&&(!df||String(x.driver||'').toLowerCase().includes(df))&&(!cf||String(x.company||'').toLowerCase().includes(cf))).sort((a,b)=>progDT(a)-progDT(b));
  $('programmingBadge').textContent=`${items.length} PROGRAMADAS`;
  $('programmingBody').innerHTML=items.length?items.map(p=>{const s=progStatus(p);return `<tr><td>${new Date(p.program_date+'T12:00').toLocaleDateString('pt-BR')}</td><td><b>${String(p.departure_time||'').slice(0,5)}</b></td><td>${esc(p.route||'—')}</td><td>${esc(p.driver||'—')}</td><td>${esc(p.company||'—')}</td><td><b>${esc(p.plate||'—')}</b></td><td>${esc(p.trip_id||'—')}</td><td><span class="scheduleStatus ${s.cls}">${s.text}</span></td><td><div class="historyActions">${p.status!=='INICIADA'?`<button class="scheduleBtn scheduleStart" onclick="startProgramming(${p.id})">Iniciada</button>`:''}<button class="scheduleBtn scheduleEdit" onclick="editProgramming(${p.id})">Editar</button><button class="scheduleBtn scheduleDelete" onclick="deleteProgramming(${p.id})">Excluir</button></div></td></tr>`}).join(''):'<tr><td colspan="9" class="empty">Nenhuma saída programada para este filtro.</td></tr>';
  const today=programmingCache.filter(x=>x.program_date===progToday()),started=today.filter(x=>x.status==='INICIADA'),next30=today.filter(x=>x.status!=='INICIADA'&&progMins(x)>=0&&progMins(x)<=30);
  $('programToday').textContent=today.length;$('programNext30').textContent=next30.length;$('programStarted').textContent=started.length;$('programPending').textContent=today.length-started.length;
  renderDepartureAlerts();
}
async function loadProgramming(){
  try{programmingCache=await api('trip_programming?select=*&order=program_date.asc,departure_time.asc');renderProgramming()}
  catch(e){console.error('Erro programação:',e)}
}
['programFilterDate','programFilterDriver','programFilterCompany'].forEach(id=>$(id).addEventListener('input',renderProgramming));
setInterval(()=>{renderDepartureAlerts();renderProgramming()},1000);
setInterval(loadProgramming,30000);
loadProgramming();

/* O render() original reescreve PERF-V6 a cada segundo.
   Este observador garante que a identificação fique PERF-V7. */
const perfObserver=new MutationObserver(()=>{
  const u=$('updated');
  if(u&&u.textContent.includes('PERF-V6'))u.textContent=u.textContent.replace('PERF-V6','PERF-V7');
});
if($('updated'))perfObserver.observe($('updated'),{childList:true,characterData:true,subtree:true});
if($('updated'))$('updated').textContent=$('updated').textContent.replace('PERF-V6','PERF-V7');
    </script>
